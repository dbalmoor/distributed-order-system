spring:
  application:
    name: saga-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5435/sagadb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: saga-group
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.deepana.saga.commondto

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: record
      missing-topics-fatal: false


server:
  port: 8084   # Any free port


logging:
  level:
    root: INFO
    com.deepana: DEBUG


management:
  endpoints:
    web:
      exposure:
        include: health,info

saga:
  deadlines:
    reserve: ${SAGA_RESERVE_DEADLINE:PT30S}
    charge: ${SAGA_CHARGE_DEADLINE:PT60S}
    confirm: ${SAGA_CONFIRM_DEADLINE:PT30S}
    compensation: ${SAGA_COMPENSATION_DEADLINE:PT60S}
  retry-budget: ${SAGA_RETRY_BUDGET:3}
  retry-backoff: ${SAGA_RETRY_BACKOFF:PT5S}
  retry-max-backoff: ${SAGA_RETRY_MAX_BACKOFF:PT1M}
  watchdog:
    enabled: ${SAGA_WATCHDOG_ENABLED:true}
    interval-ms: ${SAGA_WATCHDOG_INTERVAL_MS:1000}

outbox:
  poller:
    enabled: ${OUTBOX_POLLER_ENABLED:true}
    interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_POLL_BATCH_SIZE:50}
    lease-ms: ${OUTBOX_LEASE_MS:30000}
