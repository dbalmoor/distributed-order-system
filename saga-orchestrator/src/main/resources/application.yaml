spring:
  application:
    name: saga-orchestrator

  datasource:
    url: jdbc:postgresql://localhost:5435/sagadb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate

  kafka:
    bootstrap-servers: localhost:9092

    consumer:
      group-id: saga-group
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.deepana.saga.commondto

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: record
      missing-topics-fatal: false


server:
  port: 8084   # Any free port


logging:
  level:
    root: INFO
    com.deepana: DEBUG


management:
  endpoints:
    web:
      exposure:
        include: health,info

saga:
  step-deadline: ${SAGA_STEP_DEADLINE:PT30M}

outbox:
  poller:
    enabled: ${OUTBOX_POLLER_ENABLED:true}
    interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_POLL_BATCH_SIZE:50}
    lease-ms: ${OUTBOX_LEASE_MS:30000}
