server:
  port: 8081

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: order-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.deepana.saga.commondto.*
        spring.json.value.default.type: com.deepana.saga.commondto.base.BaseEvent

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

outbox:
  poller:
    enabled: ${OUTBOX_POLLER_ENABLED:true}
    interval-ms: ${OUTBOX_POLL_INTERVAL_MS:500}
    batch-size: ${OUTBOX_POLL_BATCH_SIZE:50}
    lease-ms: ${OUTBOX_LEASE_MS:30000}

kafka:
  retry:
    delay-ms: ${KAFKA_RETRY_DELAY_MS:1000}
    multiplier: ${KAFKA_RETRY_MULTIPLIER:2.0}
    max-delay-ms: ${KAFKA_RETRY_MAX_DELAY_MS:10000}
